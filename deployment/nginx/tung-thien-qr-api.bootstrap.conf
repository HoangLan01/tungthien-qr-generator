# Temporary HTTP-only config used once to obtain the TLS certificate.
# Replace api.example.vn before installing this file.

server {
    listen 80;
    listen [::]:80;
    server_name api.example.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 404;
    }
}
